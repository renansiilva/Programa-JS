<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRONTEIRA</title>
</head>
<body>
    <h1>SISTEMA DE FISCALIZAÇÃO</h1>
    país de moradia: <input type="text" name="txtpais" id="txtpais">
    <input type="button" value="Verificar" onclick="verificar()">
    <div id="res"
    
    ></div>
    <script>
        function verificar(){
            var txtp = document.querySelector('input#txtpais')
            var res = document.querySelector('div#res')
            var pais = txtp.value
            res.innerHTML = `<p>Você mora no <strong>${pais}</strong></p>`
            if (pais != 'Brasil' && pais != 'brasil'){
                res.innerHTML += `<p>Você precisa de <strong>VISTO!</strong></p>`
            }
            res.innerHTML += `<p>Boa viagem!</p>`
        }
    </script>
</body>
</html>
